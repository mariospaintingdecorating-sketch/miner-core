name: Core Miner 0.2.3 address repair
on:
  push:
    branches: ["fix/core-miner-0.2.3-address"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: core-miner-023-address
  cancel-in-progress: false
jobs:
  windows-address-repair:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify exact source repair before committing isolated branch
        shell: python
        run: |
          import os, pathlib, json, base64, zlib, hashlib, subprocess
          assert os.environ['GITHUB_REF_NAME'] == 'fix/core-miner-0.2.3-address'
          root=pathlib.Path('.'); out=pathlib.Path(os.environ['RUNNER_TEMP'])
          transfer=root/'build/address-023-transfer.b64'
          if transfer.exists():
              encoded=transfer.read_text().strip()
              (out/'transfer-received.b64').write_text(encoded)
              # Correct a known transcription insertion; the full source digest
              # and every before/after file hash must still match the review.
              encoded=encoded.replace('xZZrmAAN7','xZrmAAN7')
              raw=zlib.decompress(base64.b64decode(encoded,validate=True))
              assert hashlib.sha256(raw).hexdigest() == '13a76ff04f26a72ce7bf4c62a40b40d9f85bbecd70e49d087acd4b3724a521e9', 'Source transfer digest mismatch'
              document=json.loads(raw); assert document['format']==1
              subprocess.run(['git','merge-base','--is-ancestor',document['base'],'HEAD'],check=True)
              updates=[]
              for change in document['changes']:
                  p=pathlib.Path(change['path'])
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  previous=p.read_text(encoding='utf-8').replace('\r\n','\n') if p.exists() else None
                  actual=hashlib.sha256(previous.encode()).hexdigest() if previous is not None else None
                  assert actual==change['before'], 'Unexpected base content: '+str(p)
                  lines=(previous or '').splitlines(keepends=True)
                  for edit in reversed(change['edits']):
                      lines[edit['start']:edit['start']+edit['delete']]=edit['insert']
                  result=''.join(lines)
                  assert hashlib.sha256(result.encode()).hexdigest()==change['after'], 'Result digest mismatch: '+str(p)
                  updates.append((p,result))
              for p,result in updates:
                  p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(result.encode('utf-8'))
              transfer.unlink()
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','add','--']+[str(p) for p,_ in updates]+[str(transfer)],check=True)
              subprocess.run(['git','commit','-m','fix: separate ABI addresses from DApp routing and preserve wallet authorization [skip ci]'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/fix/core-miner-0.2.3-address'],check=True)
              (out/'source-transfer-verification.json').write_text(json.dumps({'passed':True,'files':len(updates),'sha256':hashlib.sha256(raw).hexdigest()},indent=2))
          assert json.loads((root/'package.json').read_text())['version']=='0.2.3-beta'
          (out/'core-miner-source-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - name: Install locked dependencies with unchanged mining module
        run: |
          $hash=(Get-FileHash 'vendor/msii-bee-miner-5.1.1-core.1.tgz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'ce83fc38df7baf8a07a0dd9a37d88d4c3b588643996c541446a873f3e3746e5e') { throw 'Mining module hash mismatch' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Ensure native read library is packaged
        run: |
          $native='node_modules/@eversdk/lib-node/eversdk.node'
          if (-not (Test-Path $native)) {
            Push-Location 'node_modules/@eversdk/lib-node'
            try { node install.js; if ($LASTEXITCODE -ne 0) { throw 'Native library installation failed' } } finally { Pop-Location }
          }
          if (-not (Test-Path $native)) { throw 'Native library missing' }
      - name: Typecheck all application layers
        run: npm run typecheck
      - name: Test real SDK address encoding and all existing functionality offline
        run: npm test -- --reporter=default --reporter=json --outputFile="${{ runner.temp }}/core-miner-023-tests.json"
      - name: Build and verify Windows installer without publishing
        run: npm run dist:win
      - name: Launch packaged application and verify QR persistence offline
        run: npm run test:packaged:win
      - name: Record signature and dependency audit
        run: |
          npm audit --json | Out-File 'release/Core-Miner-0.2.3-all-dependencies-audit.json' -Encoding utf8
          $s=Get-AuthenticodeSignature 'release/Core Miner 0.2.3 beta setup.exe'
          @{Status=$s.Status.ToString();SignerSubject=$s.SignerCertificate.Subject} | ConvertTo-Json | Out-File 'release/Core-Miner-0.2.3-signature-verification.json' -Encoding utf8
          exit 0
      - name: Verify final installer and record source identity
        shell: python
        run: |
          import pathlib, hashlib, json, subprocess
          out=pathlib.Path('release'); exe=out/'Core Miner 0.2.3 beta setup.exe'; data=exe.read_bytes()
          assert data[:2]==b'MZ' and len(data)>10_000_000
          for name in ['Core-Miner-0.2.3-package-verification.json','Core-Miner-0.2.3-windows-smoke-verification.json']:
              assert json.loads((out/name).read_text())['passed'],name
          report={'version':'0.2.3-beta','installer':exe.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'appId':'com.msii.miner-core','applicationAuthorizationId':'0x'+'30'.zfill(64),'windowsBuild':True,'realSdkOfflineAddressRegression':True,'packagedQrSmokeTested':True,'realWalletsTested':False,'mainnetMiningTested':False,'installerInteractiveUpgradeTested':False}
          (out/'Core-Miner-0.2.3-build-verification.json').write_text(json.dumps(report,indent=2))
          (out/'Core-Miner-0.2.3-SHA256.txt').write_text(report['sha256']+'  '+exe.name+'\n')
      - name: Preserve sources and test evidence
        if: always()
        run: |
          $out='${{ runner.temp }}/core-miner-023-result'
          New-Item -ItemType Directory -Force $out | Out-Null
          git archive --format=zip --output="$out/Core-Miner-0.2.3-source.zip" HEAD
          foreach ($name in @('core-miner-023-tests.json','core-miner-source-commit.txt','source-transfer-verification.json','transfer-received.b64')) { Copy-Item "${{ runner.temp }}/$name" "$out/" -ErrorAction SilentlyContinue }
          foreach ($pattern in @('*.exe','*verification.json','*audit.json','*SHA256.txt')) { Copy-Item "release/$pattern" "$out/" -ErrorAction SilentlyContinue }
          Copy-Item 'docs/UPDATE-0.2.3.md' "$out/" -ErrorAction SilentlyContinue
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-miner-0.2.3-beta-windows
          path: ${{ runner.temp }}/core-miner-023-result/
          retention-days: 30
          if-no-files-found: error
